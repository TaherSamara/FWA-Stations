<div class="modal-header edit-header">
    <div class="d-flex align-items-center gap-3">
        <div class="edit-icon">
            <i class="fe" [class.fe-edit]="subDevice" [class.fe-plus]="!subDevice"></i>
        </div>
        <h4 class="modal-title mb-0">{{ subDevice ? 'Edit Sub Device' : 'Add New Sub Device' }}</h4>
    </div>
    <button type="button" class="btn-close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body edit-body">
    <form [formGroup]="form">
        <div class="row g-3">

            <!-- Basic Information -->
            <div class="col-12 col-lg-6">
                <div class="edit-section h-100">
                    <div class="edit-section-title"><i class="fe fe-info me-2"></i>Basic Information</div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" formControlName="Name"
                                placeholder="Enter sub device name" [class.is-invalid]="submitted && f.Name.errors">
                            <div class="invalid-feedback" *ngIf="submitted && f.Name.errors?.required">
                                Name is required
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Station Name</label>
                            <input type="text" class="form-control" formControlName="StationName"
                                placeholder="Enter station name">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Line Code</label>
                            <input type="text" class="form-control" formControlName="LineCode"
                                placeholder="Enter line code">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Order Number</label>
                            <input type="text" class="form-control" formControlName="OrderNumber"
                                placeholder="Enter order number">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Unit Information -->
            <div class="col-12 col-lg-6">
                <div class="edit-section h-100">
                    <div class="edit-section-title"><i class="fe fe-cpu me-2"></i>Unit Information</div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Unit Type</label>
                            <input type="text" class="form-control" formControlName="UnitType"
                                placeholder="e.g. ONT, CPE">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Unit Direction</label>
                            <input type="text" class="form-control" formControlName="UnitDirection"
                                placeholder="e.g. Upstream">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Link MAC Address</label>
                            <input type="text" class="form-control" formControlName="LinkMacAddress"
                                placeholder="00:00:00:00:00:00">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Connection -->
            <div class="col-12 col-lg-6">
                <div class="edit-section h-100">
                    <div class="edit-section-title"><i class="fe fe-link me-2"></i>Connection</div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Connection Type</label>
                            <input type="text" class="form-control" formControlName="ConnectionType"
                                placeholder="Enter connection type">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Speed</label>
                            <input type="text" class="form-control" formControlName="Speed"
                                placeholder="e.g. 100 Mbps">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Network -->
            <div class="col-12 col-lg-6">
                <div class="edit-section h-100">
                    <div class="edit-section-title"><i class="fe fe-globe me-2"></i>Network</div>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Management IP</label>
                            <input type="text" class="form-control" formControlName="ManagementIp"
                                placeholder="192.168.1.1">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Management VLAN</label>
                            <input type="text" class="form-control" formControlName="ManagementVlan"
                                placeholder="e.g. 100">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">WAN IP</label>
                            <input type="text" class="form-control" formControlName="WanIp"
                                placeholder="Enter WAN IP">
                        </div>
                    </div>
                </div>
            </div>

            <!-- MikroTik -->
            <div class="col-12 col-lg-6">
                <div class="edit-section h-100">
                    <div class="edit-section-title"><i class="fe fe-server me-2"></i>MikroTik</div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">MikroTik ID</label>
                            <input type="text" class="form-control" formControlName="MikrotikId"
                                placeholder="Enter MikroTik ID">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">MikroTik MAC Address</label>
                            <input type="text" class="form-control" formControlName="MikrotikMacAddress"
                                placeholder="00:00:00:00:00:00">
                        </div>
                    </div>
                </div>
            </div>

            <!-- SAS & ODF -->
            <div class="col-12 col-lg-6">
                <div class="edit-section h-100">
                    <div class="edit-section-title"><i class="fe fe-database me-2"></i>SAS &amp; ODF</div>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">SAS Port</label>
                            <input type="text" class="form-control" formControlName="SasPort"
                                placeholder="Enter SAS port">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">ODF Name</label>
                            <input type="text" class="form-control" formControlName="OdfName"
                                placeholder="Enter ODF name">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">ODF Port</label>
                            <input type="text" class="form-control" formControlName="OdfPort"
                                placeholder="Enter ODF port">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Customer & Contact (one row) -->
            <div class="col-12">
                <div class="edit-section">
                    <div class="edit-section-title"><i class="fe fe-user me-2"></i>Customer &amp; Contact</div>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Contact Person</label>
                            <input type="text" class="form-control" formControlName="ContactPerson"
                                placeholder="Enter contact person name">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Contact Phone</label>
                            <input type="text" class="form-control" formControlName="ContactPersonPhoneNo"
                                placeholder="Enter phone number">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Customer Address</label>
                            <input type="text" class="form-control" formControlName="CustomerAddress"
                                placeholder="Enter customer address">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Additional Details -->
            <div class="col-12">
                <div class="edit-section">
                    <div class="edit-section-title"><i class="fe fe-file-text me-2"></i>Additional Details</div>
                    <label class="form-label">Other Details</label>
                    <textarea class="form-control" formControlName="OtherDetails" rows="3"
                        placeholder="Enter other details"></textarea>
                </div>
            </div>

        </div>
    </form>
</div>

<div class="modal-footer p-3">
    <button type="button" class="btn btn-sm btn-light" (click)="activeModal.dismiss()">
        <i class="fe fe-x me-3"></i>Cancel
    </button>
    <button type="button" class="btn btn-sm btn-primary" (click)="submit()"
        [disabled]="(httpService.getLoading('addEditAction') | async)">
        <i class="fe fe-check me-2" *ngIf="!(httpService.getLoading('addEditAction') | async)"></i>
        <span class="spinner-border spinner-border-sm me-2"
            *ngIf="(httpService.getLoading('addEditAction') | async)"></span>
        <span>{{ subDevice ? 'Update' : 'Add' }}</span>
    </button>
</div>
