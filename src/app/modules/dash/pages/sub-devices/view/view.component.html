<div class="modal-header view-header">
    <div class="d-flex align-items-center gap-3 min-w-0">
        <div class="view-icon">
            <i class="fe fe-radio"></i>
        </div>
        <div class="min-w-0">
            <h4 class="modal-title text-truncate mb-1">{{ subDevice?.name || '—' }}</h4>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <span class="badge bg-primary-soft" *ngIf="subDevice?.device?.name">
                    <i class="fe fe-hard-drive me-1"></i>{{ subDevice.device.name }}
                </span>
                <span class="text-muted small" *ngIf="subDevice?.station_name">
                    <i class="fe fe-map-pin me-1"></i>{{ subDevice.station_name }}
                </span>
            </div>
        </div>
    </div>
    <button type="button" class="btn-close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body view-body">
    <div class="row g-3">
        <ng-container *ngFor="let section of sections">
            <div class="col-12 col-lg-6" [class.col-lg-12]="section.fields.length === 1 || section.inline">
                <div class="view-section h-100">
                    <div class="view-section-title">
                        <i class="fe {{ section.icon }} me-2"></i>{{ section.title }}
                    </div>
                    <dl class="view-list mb-0" [class.is-inline]="section.inline">
                        <div class="view-item" *ngFor="let field of section.fields">
                            <dt>{{ field.label }}</dt>
                            <dd [class.is-empty]="!value(field.key)" [class.is-mono]="field.type === 'mono'"
                                [class.is-long]="field.type === 'long'">
                                <ng-container *ngIf="value(field.key); else empty">
                                    <a *ngIf="field.type === 'link'; else plain" [href]="'http://' + value(field.key)"
                                        target="_blank" class="text-primary text-decoration-none"
                                        title="Open in new tab">
                                        {{ value(field.key) }}<i class="fe fe-external-link ms-1 small"></i>
                                    </a>
                                    <ng-template #plain>{{ value(field.key) }}</ng-template>
                                </ng-container>
                                <ng-template #empty>—</ng-template>
                            </dd>
                        </div>
                    </dl>
                </div>
            </div>
        </ng-container>
    </div>
</div>

<div class="modal-footer p-3">
    <button type="button" class="btn btn-sm btn-light" (click)="activeModal.dismiss()">
        <i class="fe fe-x me-3"></i>Close
    </button>
    <button type="button" class="btn btn-sm btn-success" (click)="print()">
        <i class="fe fe-printer me-2"></i>Print
    </button>
    <button type="button" class="btn btn-sm btn-primary" (click)="activeModal.close('edit')"
        *hasPermission="PermissionCode.EDIT_SUBDEVICE">
        <i class="fe fe-edit me-2"></i>Edit
    </button>
</div>
