<div class="card">
    <div class="card-header">
        <div class="d-flex align-items-center input-group-merge input-group-flush input-group position-relative">
            <i class="fe fe-search text-muted position-absolute me-3"></i>
            <input [disabled]="totalCount == 0" [(ngModel)]="searchText" class="form-control m-0 ps-4"
                placeholder="Type to search..." (ngModelChange)="list(1)">
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-success" (click)="importExcel()"
                *hasPermission="PermissionCode.IMPORT_DEVICES">
                <i class="fe fe-upload me-3"></i>
                <span>Import</span>
            </button>
            <button class="btn btn-sm btn-light" (click)="add()" *hasPermission="PermissionCode.ADD_DEVICE">
                <i class="fe fe-plus me-3"></i>
                <span>New Device</span>
            </button>
        </div>
    </div>

    <div class="card-body devices-body">
        <div class="row g-3" *ngIf="!(httpService.getLoading('devicesList') | async) && totalRecords > 0">
            <div class="col-12 col-sm-6 col-lg-4 col-xxl-3"
                *ngFor="let device of devices | paginate: { itemsPerPage: size, currentPage: page, totalItems: totalRecords }">
                <div class="device-card" [class.is-clickable]="canViewSubDevices" (click)="viewSubDevices(device)">
                    <div class="device-main">
                        <div class="device-icon">
                            <i class="fe fe-radio"></i>
                        </div>
                        <div class="device-info">
                            <h4 class="device-name" [title]="device?.name">{{ device?.name || '-' }}</h4>
                            <span class="device-type">{{ typeLabel }}</span>
                        </div>
                        <i class="fe fe-chevron-right device-arrow" *ngIf="canViewSubDevices"></i>
                    </div>

                    <div class="device-actions" (click)="$event.stopPropagation()" *ngIf="hasAnyAction">
                        <button class="action-btn" title="Edit" (click)="edit(device)"
                            *hasPermission="PermissionCode.EDIT_DEVICE">
                            <i class="fe fe-edit"></i><span>Edit</span>
                        </button>
                        <button class="action-btn" title="Export" (click)="exportExcel(device)"
                            *hasPermission="PermissionCode.EXPORT_DEVICES">
                            <i class="fe fe-download"></i><span>Export</span>
                        </button>
                        <button class="action-btn is-danger" title="Delete" (click)="delete(device)"
                            *hasPermission="PermissionCode.DELETE_DEVICE">
                            <i class="fe fe-trash-2"></i><span>Delete</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3" *ngIf="(httpService.getLoading('devicesList') | async)">
            <div class="col-12 col-sm-6 col-lg-4 col-xxl-3" *ngFor="let number of [].constructor(+size)">
                <div class="device-card is-loading">
                    <div class="device-main">
                        <ngx-skeleton-loader appearance="circle" animation="progress-dark"
                            [theme]="{width:'44px',height:'44px','border-radius':'12px','margin':'0'}"></ngx-skeleton-loader>
                        <div class="flex-grow-1">
                            <ngx-skeleton-loader appearance="line" animation="progress-dark"
                                [theme]="{width:'70%',height:'16px','border-radius':'3px','margin':'0 0 6px 0'}"></ngx-skeleton-loader>
                            <ngx-skeleton-loader appearance="line" animation="progress-dark"
                                [theme]="{width:'40%',height:'12px','border-radius':'3px','margin':'0'}"></ngx-skeleton-loader>
                        </div>
                    </div>
                    <div class="device-actions">
                        <ngx-skeleton-loader appearance="line" animation="progress-dark"
                            [theme]="{width:'100%',height:'28px','border-radius':'6px','margin':'0'}"></ngx-skeleton-loader>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- if no results -->
    <app-no-results [isLoading$]="httpService.getLoading('devicesList')" [totalRecords]="totalRecords"></app-no-results>

    <!-- pagination -->
    <app-pagination [isLoading$]="httpService.getLoading('devicesList')" [totalRecords]="totalRecords" [size]="size"
        (pageChange)="list($event)"></app-pagination>
</div>
<br>
