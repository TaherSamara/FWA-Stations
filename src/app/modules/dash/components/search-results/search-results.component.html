<div class="modal-header ">
    <h4 class="modal-title">Search Results</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
    <!-- No Results -->
    <div *ngIf="!hasResults()" class="text-center py-5">
        <i class="fe fe-search fs-1 text-muted mb-3 d-block"></i>
        <h5 class="text-muted">No results found</h5>
        <p class="text-muted mb-0">Try searching with different keywords</p>
    </div>

    <!-- Results -->
    <div *ngIf="hasResults()" class="search-results-container">

        <!-- Devices Section -->
        <div *ngIf="results.devices.count > 0" class="result-section">
            <div class="section-header d-flex align-items-center mb-2">
                <i class="fe fe-server me-2 text-{{ getCategoryColor('Device') }}"></i>
                <h5 class="mb-0 fw-bold">Devices ({{ results.devices.count }})</h5>
            </div>
            <div class="result-items">
                <div *ngFor="let item of results.devices.items"
                    class="result-item d-flex align-items-center p-3 mb-2 border rounded cursor-pointer hover-shadow"
                    (click)="navigateTo(item)">
                    <div class="result-icon me-3">
                        <div class="avatar avatar-sm">
                            <div
                                class="avatar-img rounded-circle bg-{{ getCategoryColor('Device') }}-soft d-flex align-items-center justify-content-center">
                                <i class="fe {{ getCategoryIcon(item) }} text-{{ getCategoryColor('Device') }}"></i>
                            </div>
                        </div>
                    </div>
                    <div class="result-content flex-grow-1">
                        <div class="fw-bold">{{ item.title }}</div>
                        <small class="text-muted">{{ getDeviceTab(item)?.label || item.subtitle }}</small>
                    </div>
                    <i class="fe fe-chevron-right text-muted"></i>
                </div>
            </div>
        </div>

        <!-- Sub Devices Section -->
        <div *ngIf="results.subDevices.count > 0" class="result-section">
            <div class="section-header d-flex align-items-center mb-2">
                <i class="fe fe-radio me-2 text-{{ getCategoryColor('SubDevice') }}"></i>
                <h5 class="mb-0 fw-bold">Sub Devices ({{ results.subDevices.count }})</h5>
            </div>
            <div class="result-items">
                <div *ngFor="let item of results.subDevices.items"
                    class="result-item d-flex align-items-center p-3 mb-2 border rounded cursor-pointer hover-shadow"
                    (click)="navigateTo(item)">
                    <div class="result-icon me-3">
                        <div class="avatar avatar-sm">
                            <div
                                class="avatar-img rounded-circle bg-{{ getCategoryColor('SubDevice') }}-soft d-flex align-items-center justify-content-center">
                                <i class="fe fe-radio text-{{ getCategoryColor('SubDevice') }}"></i>
                            </div>
                        </div>
                    </div>
                    <div class="result-content flex-grow-1">
                        <div class="fw-bold">{{ item.title }}</div>
                        <small class="text-muted">{{ item.subtitle }}</small>
                    </div>
                    <i class="fe fe-chevron-right text-muted"></i>
                </div>
            </div>
        </div>

    </div>
</div>
<div class="modal-footer p-3">
    <button type="button" class="btn btn-sm btn-light" (click)="activeModal.dismiss()">
        <i class="fe fe-x me-3"></i>Close</button>
</div>
